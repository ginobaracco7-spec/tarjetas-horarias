<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Tarjetas Horarias · Agroterra New Holland</title>
<link rel="icon" href="/icon.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<div id="pickerScreen" class="login-box">
  <img id="logoImgPicker" class="logo visible" style="height:60px;margin-bottom:10px;" src="/logo.png" alt="" onerror="this.style.display='none'" />
  <h2>Control de Tarjetas Horarias</h2>
  <p>¿Quién sos?</p>
  <div id="pickerList" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;"></div>
</div>

<div id="appScreen" style="display:none;">
  <header class="app-header">
    <div class="title">
      <img id="logoImg" class="logo" src="/logo.png" alt="Logo" onerror="this.style.display='none'" />
      <div>
        <h1>Control de Tarjetas Horarias</h1>
        <div class="subtitle">Agroterra New Holland</div>
      </div>
    </div>
    <div class="header-right">
      <div class="subtitle" id="whoSubtitle">Vista para técnicos · solo lectura</div>
      <img class="corner-logo" src="/icon.png" alt="Agroterra" onerror="this.style.display='none'" />
    </div>
  </header>

  <main>
    <div class="card">
      <strong>Tus tarjetas</strong>
      <div id="pendingBox" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="month-nav">
        <button id="prevBtn">‹ Mes anterior</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="nextBtn">Mes siguiente ›</button>
        <button id="todayBtn">Hoy</button>
      </div>
      <div id="gridBox">Cargando...</div>
      <div class="legend" id="legendBox"></div>
    </div>

    <div class="sync-note" id="syncNote"></div>
    <div style="text-align:center;margin-top:6px;">
      <a href="#" id="changeTechLink" style="font-size:12px;color:var(--muted);">No soy yo, cambiar técnico</a>
    </div>
  </main>
</div>

<footer>Se actualiza automáticamente. Si no ves cambios recientes, actualizá la página.</footer>

<script src="/shared.js"></script>
<script>
  const STORAGE_KEY = "tarjetas_tech_id";
  // Clave pública VAPID para las notificaciones push (no es secreta, va en el cliente).
  const VAPID_PUBLIC_KEY = "BHOtMgk0JDR428WzPs731aFxu2iIZkE00K_hY9UHP0NG4tqaRGoGdrlF077Ce_wH4sU5b3kABtyHK_D0uSyxCVY";

  const pickerScreen = document.getElementById("pickerScreen");
  const pickerList = document.getElementById("pickerList");
  const appScreen = document.getElementById("appScreen");
  const whoSubtitle = document.getElementById("whoSubtitle");

  let year, month;
  let state = { technicians: [], entries: {} };
  let myTechId = localStorage.getItem(STORAGE_KEY) || null;
  let notifSetupDone = false;
  const today = new Date();
  year = today.getFullYear();
  month = today.getMonth();

  const monthLabel = document.getElementById("monthLabel");
  const gridBox = document.getElementById("gridBox");
  const pendingBox = document.getElementById("pendingBox");
  const legendBox = document.getElementById("legendBox");
  const syncNote = document.getElementById("syncNote");

  renderLegend(legendBox);

  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  // Pide permiso de notificaciones y suscribe este celular a los recordatorios
  // del técnico elegido. Si el navegador no soporta push, no hace nada (silencioso).
  async function enableNotifications(techId) {
    if (!techId) return;
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
    try {
      const reg = await navigator.serviceWorker.register("/sw.js");
      const permission = await Notification.requestPermission();
      if (permission !== "granted") return;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      await fetch("/api/subscribe", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ techId, subscription: sub.toJSON ? sub.toJSON() : sub }),
      });
    } catch (e) {
      // Sin permisos o sin soporte: seguimos funcionando igual, solo sin avisos push.
    }
  }

  function showPicker() {
    const techs = state.technicians || [];
    if (techs.length === 0) {
      pickerList.innerHTML = '<p class="empty">Todavía no hay técnicos cargados. Pedile a tu administrador que los agregue.</p>';
    } else {
      pickerList.innerHTML = "";
      techs.forEach((t) => {
        const btn = document.createElement("button");
        btn.className = "primary-btn";
        btn.style.width = "100%";
        btn.textContent = t.name;
        btn.addEventListener("click", () => {
          myTechId = t.id;
          localStorage.setItem(STORAGE_KEY, myTechId);
          pickerScreen.style.display = "none";
          appScreen.style.display = "block";
          draw();
          notifSetupDone = true;
          enableNotifications(myTechId);
        });
        pickerList.appendChild(btn);
      });
    }
    pickerScreen.style.display = "block";
    appScreen.style.display = "none";
  }

  document.getElementById("changeTechLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem(STORAGE_KEY);
    myTechId = null;
    showPicker();
  });

  function draw() {
    const me = (state.technicians || []).find((t) => t.id === myTechId);
    if (me) {
      whoSubtitle.textContent = "Vista de " + me.name;
    }
    monthLabel.textContent = formatMonthLabel(year, month);
    renderGrid({ container: gridBox, state, year, month, editable: false, onlyTechId: myTechId });
    drawPending();
  }

  function drawPending() {
    const allPending = pendingThisWeek(state, new Date());
    const mine = allPending.find((p) => p.tech.id === myTechId);

    if (!mine || mine.days.length === 0) {
      pendingBox.innerHTML = `<span style="color:#2e7d32;font-weight:600;">Estás al día, no tenés tarjetas pendientes 🎉</span>`;
      return;
    }

    const todayStr = todayKey();
    const missingToday = mine.days.some((d) => d.key === todayStr);
    const previousDays = mine.days.filter((d) => d.key !== todayStr);

    let msg = "";
    if (previousDays.length > 0) {
      const oldest = previousDays[0];
      const oldestDate = parseDateKey(oldest.key);
      const diffDays = Math.max(1, Math.round((new Date().setHours(0, 0, 0, 0) - oldestDate.getTime()) / 86400000));
      const plural = previousDays.length === 1 ? "una tarjeta pendiente" : previousDays.length + " tarjetas pendientes";
      msg += `Tenés ${plural} de hace ${diffDays} día${diffDays === 1 ? "" : "s"}. `;
    }
    if (missingToday) {
      msg += "Recordá entregar la de hoy.";
    }

    pendingBox.innerHTML = `<div class="pending-item" style="background:#fff3f2;"><span style="color:#a83c3c;font-weight:600;">${escapeHtml(msg.trim())}</span></div>`;
  }

  async function load() {
    try {
      state = await fetchState();
      const stillExists = (state.technicians || []).some((t) => t.id === myTechId);
      if (!myTechId || !stillExists) {
        localStorage.removeItem(STORAGE_KEY);
        myTechId = null;
        showPicker();
        return;
      }
      pickerScreen.style.display = "none";
      appScreen.style.display = "block";
      draw();
      syncNote.textContent = state.updatedAt ? "Última actualización: " + new Date(state.updatedAt).toLocaleString("es-AR") : "";
      if (!notifSetupDone) {
        notifSetupDone = true;
        enableNotifications(myTechId);
      }
    } catch (e) {
      gridBox.innerHTML = '<p class="empty">No se pudo cargar la información. Reintentando...</p>';
    }
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    month--; if (month < 0) { month = 11; year--; } draw();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    month++; if (month > 11) { month = 0; year++; } draw();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    year = today.getFullYear(); month = today.getMonth(); draw();
  });

  load();
  setInterval(load, 25000);
</script>
</body>
</html>
